<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Unit Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #125aa0;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Physics Unit Converter</h1>

    <label>Enter Value</label>
    <input type="number" id="value" placeholder="Enter value">

    <label>From Unit</label>
    <select id="fromUnit">
        <option value="m">Meter (m)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="mm">Millimeter (mm)</option>
        <option value="km">Kilometer (km)</option>
        <option value="nm">Nanometer (nm)</option>
        <option value="um">Micrometer (µm)</option>
    </select>

    <label>To Unit</label>
    <select id="toUnit">
        <option value="m">Meter (m)</option>
        <option value="cm">Centimeter (cm)</option>
        <option value="mm">Millimeter (mm)</option>
        <option value="km">Kilometer (km)</option>
        <option value="nm">Nanometer (nm)</option>
        <option value="um">Micrometer (µm)</option>
    </select>

    <button onclick="convert()">Convert</button>

    <div id="result">
        Result will appear here
    </div>

</div>

<script>

function convert() {

    let value = parseFloat(document.getElementById("value").value);
    let from = document.getElementById("fromUnit").value;
    let to = document.getElementById("toUnit").value;

    if (isNaN(value)) {
        document.getElementById("result").innerHTML =
            "Please enter a value.";
        return;
    }

    // Convert everything to meters
    let inMeters = 0;

    if (from === "m") {
        inMeters = value;
    } 
    else if (from === "cm") {
        inMeters = value / 100;
    } 
    else if (from === "mm") {
        inMeters = value / 1000;
    } 
    else if (from === "km") {
        inMeters = value * 1000;
    } 
    else if (from === "nm") {
        inMeters = value / 1000000000;
    } 
    else if (from === "um") {
        inMeters = value / 1000000;
    }

    // Convert meters to selected unit
    let result = 0;

    if (to === "m") {
        result = inMeters;
    } 
    else if (to === "cm") {
        result = inMeters * 100;
    } 
    else if (to === "mm") {
        result = inMeters * 1000;
    } 
    else if (to === "km") {
        result = inMeters / 1000;
    } 
    else if (to === "nm") {
        result = inMeters * 1000000000;
    } 
    else if (to === "um") {
        result = inMeters * 1000000;
    }

    document.getElementById("result").innerHTML =
        value + " " + from + " = " + result + " " + to;
}

</script>

</body>
</html>
