<!DOCTYPE html>
<html>
<head>
    <title>Physics Unit Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            color: #222;
        }

        select, input, button {
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚛️ Physics Unit Converter</h1>

    <select id="category" onchange="loadUnits()">
        <option value="">Select Category</option>
        <option value="length">Length</option>
        <option value="mass">Mass</option>
        <option value="time">Time</option>
        <option value="temperature">Temperature</option>
        <option value="velocity">Velocity</option>
        <option value="force">Force</option>
        <option value="energy">Energy</option>
        <option value="power">Power</option>
        <option value="pressure">Pressure</option><option value="acceleration">Acceleration</option>
<option value="density">Density</option>
<option value="voltage">Voltage</option>
<option value="current">Current</option>
<option value="resistance">Resistance</option>
<option value="frequency">Frequency</option>
<option value="charge">Electric Charge</option>
<option value="area">Area</option>
<option value="volume">Volume</option>
<option value="momentum">Momentum</option>
    </select>

    <input type="number" id="value" placeholder="Enter value">

    <select id="fromUnit"></select>

    <select id="toUnit"></select>

    <button onclick="convert()">Convert</button>

    <div id="result"></div>

</div>

<script>

const units = {

    length: {
        meter: 1,
        kilometer: 1000,
        centimeter: 0.01,
        millimeter: 0.001,
        micrometer: 0.000001,
        nanometer: 0.000000001
    },

    mass: {
        kilogram: 1,
        gram: 0.001,
        milligram: 0.000001
    },

    time: {
        second: 1,
        minute: 60,
        hour: 3600,
        day: 86400
    },

    velocity: {
        "m/s": 1,
        "km/h": 0.2777778
    },

    force: {
        newton: 1,
        kilonewton: 1000
    },

    energy: {
        joule: 1,
        kilojoule: 1000,
        calorie: 4.184
    },

    power: {
        watt: 1,
        kilowatt: 1000,
        megawatt: 1000000
    },

    pressure: {    acceleration: {
        "m/s²": 1,
        "km/s²": 1000,
        "cm/s²": 0.01
    },

    density: {
        "kg/m³": 1,
        "g/cm³": 1000,
        "kg/L": 1000
    },

    voltage: {
        volt: 1,
        millivolt: 0.001,
        kilovolt: 1000
    },

    current: {
        ampere: 1,
        milliampere: 0.001,
        microampere: 0.000001
    },

    resistance: {
        ohm: 1,
        kiloohm: 1000,
        megaohm: 1000000
    },

    frequency: {
        hertz: 1,
        kilohertz: 1000,
        megahertz: 1000000
    },

    charge: {
        coulomb: 1,
        millicoulomb: 0.001,
        microcoulomb: 0.000001
    },

    area: {
        "m²": 1,
        "cm²": 0.0001,
        "km²": 1000000
    },

    volume: {
        "m³": 1,
        liter: 0.001,
        milliliter: 0.000001,
        "cm³": 0.000001
    },

    momentum: {
        "kg·m/s": 1,
        "g·cm/s": 0.00001
    }
        pascal: 1,
        kilopascal: 1000,
        megapascal: 1000000
    }

};

function loadUnits() {

    const category = document.getElementById("category").value;

    const from = document.getElementById("fromUnit");
    const to = document.getElementById("toUnit");

    from.innerHTML = "";
    to.innerHTML = "";

    if (category === "temperature") {

        addOption(from, "Celsius");
        addOption(from, "Fahrenheit");
        addOption(from, "Kelvin");

        addOption(to, "Celsius");
        addOption(to, "Fahrenheit");
        addOption(to, "Kelvin");

        return;
    }

    if (!units[category]) return;

    for (let unit in units[category]) {
        addOption(from, unit);
        addOption(to, unit);
    }
}

function addOption(select, text) {

    const option = document.createElement("option");

    option.value = text;
    option.textContent = text;

    select.appendChild(option);
}

function convert() {

    const category = document.getElementById("category").value;
    const value = parseFloat(document.getElementById("value").value);

    const from = document.getElementById("fromUnit").value;
    const to = document.getElementById("toUnit").value;

    if (isNaN(value)) {
        document.getElementById("result").innerHTML =
        "Please enter a value.";
        return;
    }

    let result;

    if (category === "temperature") {

        let celsius;

        if (from === "Celsius") {
            celsius = value;
        } 
        else if (from === "Fahrenheit") {
            celsius = (value - 32) * 5 / 9;
        } 
        else if (from === "Kelvin") {
            celsius = value - 273.15;
        }

        if (to === "Celsius") {
            result = celsius;
        } 
        else if (to === "Fahrenheit") {
            result = (celsius * 9 / 5) + 32;
        } 
        else if (to === "Kelvin") {
            result = celsius + 273.15;
        }

    } else {

        const baseValue = value * units[category][from];

        result = baseValue / units[category][to];
    }

    document.getElementById("result").innerHTML =
        "Result = " + result;
}

</script>

</body>
</html>
