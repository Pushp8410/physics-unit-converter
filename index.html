<!DOCTYPE html>
<html>
<head>
    <title>PC Physics Unit Converter</title>
    <link rel="manifest" href="manifest.json">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            color: #222;
        }

        select, input, button {
            width: 90%;
            padding: 12px;
            margin: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            word-wrap: break-word;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚛️ PC Physics Unit Converter</h1>

    <select id="category" onchange="loadUnits()">

        <option value="">Select Category</option>

        <option value="length">Length</option>
        <option value="mass">Mass</option>
        <option value="time">Time</option>
        <option value="temperature">Temperature</option>
        <option value="velocity">Velocity</option>
        <option value="acceleration">Acceleration</option>
        <option value="force">Force</option>
        <option value="energy">Energy</option>
        <option value="power">Power</option>
        <option value="pressure">Pressure</option>
        <option value="density">Density</option>
        <option value="voltage">Voltage</option>
        <option value="current">Current</option>
        <option value="resistance">Resistance</option>
        <option value="frequency">Frequency</option>
        <option value="charge">Electric Charge</option>
        <option value="area">Area</option>
        <option value="volume">Volume</option>
        <option value="momentum">Momentum</option>

        <!-- NEW -->
        <option value="magnetic">🧲 Magnetic Quantities (SI ↔ CGS)</option>

    </select>

    <input
        type="number"
        id="value"
        placeholder="Enter value"
    >

    <select id="fromUnit"></select>

    <select id="toUnit"></select>

    <button onclick="convert()">Convert</button>

    <div id="result"></div>

</div>

<script>

const units = {

    length: {
        meter: 1,
        kilometer: 1000,
        centimeter: 0.01,
        millimeter: 0.001,
        micrometer: 0.000001,
        nanometer: 0.000000001
    },

    mass: {
        kilogram: 1,
        gram: 0.001,
        milligram: 0.000001
    },

    time: {
        second: 1,
        minute: 60,
        hour: 3600,
        day: 86400
    },

    velocity: {
        "m/s": 1,
        "km/h": 0.2777778
    },

    acceleration: {
        "m/s²": 1,
        "km/s²": 1000,
        "cm/s²": 0.01
    },

    force: {
        newton: 1,
        kilonewton: 1000,
        meganewton: 1000000,
        dyne: 0.00001,
        pound_force: 4.448221615
    },

    energy: {
        joule: 1,
        kilojoule: 1000,
        calorie: 4.184,
        kilocalorie: 4184,
        erg: 0.0000001,
        eV: 1.602176634e-19,
        keV: 1.602176634e-16,
        MeV: 1.602176634e-13,
        GeV: 1.602176634e-10
    },

    power: {
        watt: 1,
        kilowatt: 1000,
        megawatt: 1000000
    },

    pressure: {
        pascal: 1,
        kilopascal: 1000,
        megapascal: 1000000
    },

    density: {
        "kg/m³": 1,
        "g/cm³": 1000,
        "kg/L": 1000
    },

    voltage: {
        volt: 1,
        millivolt: 0.001,
        kilovolt: 1000
    },

    current: {
        ampere: 1,
        milliampere: 0.001,
        microampere: 0.000001
    },

    resistance: {
        ohm: 1,
        kiloohm: 1000,
        megaohm: 1000000
    },

    frequency: {
        hertz: 1,
        kilohertz: 1000,
        megahertz: 1000000
    },

    charge: {
        coulomb: 1,
        millicoulomb: 0.001,
        microcoulomb: 0.000001
    },

    area: {
        "m²": 1,
        "cm²": 0.0001,
        "km²": 1000000
    },

    volume: {
        "m³": 1,
        liter: 0.001,
        milliliter: 0.000001,
        "cm³": 0.000001
    },

    momentum: {
        "kg·m/s": 1,
        "g·cm/s": 0.00001
    },

    /* =====================================
       MAGNETIC QUANTITIES
       SI ↔ CGS
       ===================================== */

    magnetic: {

        /* Magnetic induction
           1 T = 10^4 G
        */
        "Magnetic Induction — Tesla (T)": 1,
        "Magnetic Induction — Gauss (G)": 0.0001,

        /* Magnetic field
           1 A/m = 4π × 10^-3 Oe
        */
        "Magnetic Field — A/m": 1,
        "Magnetic Field — Oersted (Oe)": 1000 / (4 * Math.PI),

        /* Magnetization
           1 A/m = 10^-3 emu/cm³
        */
        "Magnetization — A/m": 1,
        "Magnetization — emu/cm³": 1000,

        /* Magnetic polarization
           Standard B conversion:
           1 T = 10^4 G
        */
        "Magnetic Polarization — T": 1,
        "Magnetic Polarization — G": 0.0001,

        /* Magnetic moment
           1 A m² = 10^3 emu
        */
        "Magnetic Moment — A·m²": 1,
        "Magnetic Moment — emu": 0.001,

        /* Magnetic moment per unit mass
           1 A m²/kg = 1 emu/g
        */
        "Magnetic Moment per Unit Mass — A·m²/kg": 1,
        "Magnetic Moment per Unit Mass — emu/g": 1,

        /* Volume magnetic susceptibility
           1(SI) = 1/(4π) CGS
        */
        "Volume Magnetic Susceptibility — SI": 1,
        "Volume Magnetic Susceptibility — CGS": 1 / (4 * Math.PI),

        /* Mass magnetic susceptibility
           1 m³/kg = 10³/(4π) emu Oe⁻¹ g⁻¹
        */
        "Mass Magnetic Susceptibility — m³/kg": 1,
        "Mass Magnetic Susceptibility — emu Oe⁻¹ g⁻¹":
            1000 / (4 * Math.PI),

        /* Molar magnetic susceptibility
           1 m³/mol = 10^6/(4π) emu Oe⁻¹ g⁻¹ mol⁻¹
        */
        "Molar Magnetic Susceptibility — m³/mol": 1,
        "Molar Magnetic Susceptibility — emu Oe⁻¹ g⁻¹ mol⁻¹":
            1000000 / (4 * Math.PI),

        /* Magnetic permeability
           1 H/m = 10^7/(4π) G Oe⁻¹
        */
        "Magnetic Permeability — H/m": 1,
        "Magnetic Permeability — G/Oe":
            10000000 / (4 * Math.PI),

        /* Magnetic flux
           1 Wb = 10^8 Mx
        */
        "Magnetic Flux — Weber (Wb)": 1,
        "Magnetic Flux — Maxwell (Mx)": 0.00000001,

        /* Magnetic scalar potential / magnetomotive force
           1 A = 4π/10 gilbert
        */
        "Magnetic Scalar Potential — A": 1,
        "Magnetic Scalar Potential — gilbert":
            4 * Math.PI / 10,

        /* Magnetic vector potential
           1 Wb/m = 10^6 emu
        */
        "Magnetic Vector Potential — Wb/m": 1,
        "Magnetic Vector Potential — emu": 0.000001,

        /* Magnetic pole strength
           1 A·m = 10 emu
        */
        "Magnetic Pole Strength — A·m": 1,
        "Magnetic Pole Strength — emu": 0.1,

        /* Dimensionless quantities
           SI = CGS
        */
        "Demagnetizing Factor — SI": 1,
        "Demagnetizing Factor — CGS": 1,

        "Magnetostriction Constant — SI": 1,
        "Magnetostriction Constant — CGS": 1,

        /* Anisotropy constant
           1 J/m³ = 10 erg/cm³
        */
        "Anisotropy Constant — J/m³": 1,
        "Anisotropy Constant — erg/cm³": 0.1,

        /* Magnetostatic energy
           1 J/m³ = 10 erg/cm³
        */
        "Magnetostatic Energy — J/m³": 1,
        "Magnetostatic Energy — erg/cm³": 0.1,

        /* Energy product
           1 J/m³ = 10 erg/cm³
        */
        "Energy Product — J/m³": 1,
        "Energy Product — erg/cm³": 0.1
    }

};


/* =====================================
   LOAD UNITS
   ===================================== */

function loadUnits() {

    const category =
        document.getElementById("category").value;

    const from =
        document.getElementById("fromUnit");

    const to =
        document.getElementById("toUnit");

    from.innerHTML = "";
    to.innerHTML = "";

    if (category === "temperature") {

        addOption(from, "Celsius");
        addOption(from, "Fahrenheit");
        addOption(from, "Kelvin");

        addOption(to, "Celsius");
        addOption(to, "Fahrenheit");
        addOption(to, "Kelvin");

        return;
    }

    if (!units[category]) {
        return;
    }

    Object.keys(units[category]).forEach(function(unit) {

        addOption(from, unit);
        addOption(to, unit);

    });
}


/* =====================================
   ADD OPTION
   ===================================== */

function addOption(select, text) {

    const option =
        document.createElement("option");

    option.value = text;
    option.textContent = text;

    select.appendChild(option);
}


/* =====================================
   CONVERT
   ===================================== */

function convert() {

    const category =
        document.getElementById("category").value;

    const value =
        parseFloat(
            document.getElementById("value").value
        );

    const from =
        document.getElementById("fromUnit").value;

    const to =
        document.getElementById("toUnit").value;

    const resultBox =
        document.getElementById("result");


    if (category === "") {

        resultBox.innerHTML =
            "Please select a category.";

        return;
    }


    if (isNaN(value)) {

        resultBox.innerHTML =
            "Please enter a value.";

        return;
    }


    let result;


    /* ==============================
       TEMPERATURE
       ============================== */

    if (category === "temperature") {

        let celsius;


        if (from === "Celsius") {

            celsius = value;

        }

        else if (from === "Fahrenheit") {

            celsius =
                (value - 32) * 5 / 9;

        }

        else if (from === "Kelvin") {

            celsius =
                value - 273.15;

        }


        if (to === "Celsius") {

            result = celsius;

        }

        else if (to === "Fahrenheit") {

            result =
                (celsius * 9 / 5) + 32;

        }

        else if (to === "Kelvin") {

            result =
                celsius + 273.15;

        }

    }


    /* ==============================
       ALL OTHER CATEGORIES
       ============================== */

    else {

        const baseValue =
            value * units[category][from];

        result =
            baseValue / units[category][to];

    }


    /* ==============================
       DISPLAY RESULT
       ============================== */

    resultBox.innerHTML =
        "Result = " + formatResult(result);

}


/* =====================================
   RESULT FORMATTING
   ===================================== */

function formatResult(number) {

    if (!isFinite(number)) {
        return "Error";
    }

    if (number === 0) {
        return "0";
    }

    if (
        Math.abs(number) >= 0.000001 &&
        Math.abs(number) < 1000000000
    ) {
        return Number(number.toFixed(10));
    }

    return number.toExponential(6);
}

</script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./service-worker.js');
}
</script>
</body>
</html>
