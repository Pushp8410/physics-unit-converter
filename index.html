<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Physics Unit Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #1976d2;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #125aa0;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>⚛️ Physics Unit Converter</h1>

    <label>Select Category</label>

    <select id="category" onchange="loadUnits()">
        <option value="length">Length</option>
        <option value="mass">Mass</option>
        <option value="time">Time</option>
    </select>

    <label>Enter Value</label>

    <input type="number" id="value" placeholder="Enter value">

    <label>From Unit</label>

    <select id="fromUnit"></select>

    <label>To Unit</label>

    <select id="toUnit"></select>

    <button onclick="convert()">Convert</button>

    <div id="result">
        Result will appear here
    </div>

</div>

<script>

const units = {

    length: {
        m: 1,
        cm: 0.01,
        mm: 0.001,
        km: 1000,
        nm: 0.000000001,
        um: 0.000001
    },

    mass: {
        kg: 1,
        g: 0.001,
        mg: 0.000001,
        ug: 0.000000001
    },

    time: {
        s: 1,
        ms: 0.001,
        min: 60,
        hour: 3600,
        day: 86400
    }

};


const unitNames = {

    length: {
        m: "Meter (m)",
        cm: "Centimeter (cm)",
        mm: "Millimeter (mm)",
        km: "Kilometer (km)",
        nm: "Nanometer (nm)",
        um: "Micrometer (µm)"
    },

    mass: {
        kg: "Kilogram (kg)",
        g: "Gram (g)",
        mg: "Milligram (mg)",
        ug: "Microgram (µg)"
    },

    time: {
        s: "Second (s)",
        ms: "Millisecond (ms)",
        min: "Minute (min)",
        hour: "Hour (h)",
        day: "Day"
    }

};


function loadUnits() {

    let category = document.getElementById("category").value;

    let fromUnit = document.getElementById("fromUnit");
    let toUnit = document.getElementById("toUnit");

    fromUnit.innerHTML = "";
    toUnit.innerHTML = "";

    for (let unit in units[category]) {

        let option1 = document.createElement("option");
        option1.value = unit;
        option1.textContent = unitNames[category][unit];

        let option2 = document.createElement("option");
        option2.value = unit;
        option2.textContent = unitNames[category][unit];

        fromUnit.appendChild(option1);
        toUnit.appendChild(option2);
    }
}


function convert() {

    let value = parseFloat(
        document.getElementById("value").value
    );

    let category = document.getElementById("category").value;

    let from = document.getElementById("fromUnit").value;

    let to = document.getElementById("toUnit").value;

    if (isNaN(value)) {

        document.getElementById("result").innerHTML =
            "⚠️ Please enter a value.";

        return;
    }

    // Convert to base unit

    let baseValue = value * units[category][from];

    // Convert to target unit

    let result = baseValue / units[category][to];

    document.getElementById("result").innerHTML =
        value + " " +
        unitNames[category][from] +
        " = " +
        result + " " +
        unitNames[category][to];
}


// Load units when page opens

loadUnits();

</script>

</body>
</html>
